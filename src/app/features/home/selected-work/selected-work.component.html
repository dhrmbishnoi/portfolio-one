<section class="work cinema" id="work" aria-labelledby="work-title">
  <div class="work__scrim" aria-hidden="true"></div>

  <div class="work__inner shell">
    <header class="work__head">
      <p class="work__label label" [appReveal]="'rise'">
        <span class="work__label-rule" aria-hidden="true"></span>
        Selected work — 01 / 03
      </p>

      <h2 class="work__title display" id="work-title" [appReveal]="headlineReveal">
        Three projects, three different <span class="gradient-text">problems.</span>
      </h2>

      <p class="work__lede body-lg" [appReveal]="{ type: 'blur', delay: 0.25 }">
        A dense real-time planning surface, infrastructure other teams build on,
        and a tool for measuring the interface itself. Different problems, the
        same method.
      </p>

      <a
        class="btn btn--ghost work__all"
        routerLink="/work"
        appMagnetic
        [appReveal]="{ type: 'rise', delay: 0.35 }"
      >
        <span class="magnetic__inner">
          All work and case studies
          <span class="arrow" aria-hidden="true">→</span>
        </span>
      </a>
    </header>

    <div class="work__list">
      <app-project-orbital />
      <app-project-forge />
      <app-project-signal />
    </div>
  </div>
</section>
